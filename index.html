    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Roboto", sans-serif;
        }

        /* NAVIGATION CONTAINER */

        .navigation-bar {
            width: 100%;
        }

        /* TOP NAVIGATION BAR */

        .top-navbar {
            background-color: #222831;
            padding: 10px 5%;
        }

        .top-navbar ul {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 25px;
            list-style: none;
        }

        .top-navbar li {
            display: flex;
            align-items: center;
        }

        .top-navbar a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s ease;
        }

        .top-navbar a:hover {
            color: #d6b36a;
        }

        .top-navbar img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        .main-navbar {
            background-color: #ffffff;
            min-height: 100px;
            padding: 15px 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        .main-navbar ul {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            list-style: none;
        }

        .main-navbar li {
            position: relative;
        }

        .main-navbar a {
            color: #222831;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            padding: 12px 15px;
            position: relative;
        }

        .main-navbar a::after {
            content: "";
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: #c49a45;
            transition: width 0.3s ease, left 0.3s ease;
        }

        .main-navbar a:hover::after {
            width: 100%;
            left: 0;
        }

        /* LOGO POSITIONING */

        .logo {
            margin-left: auto;
            order: 2;
        }

        .logo img {
            width: 120px;
            height: auto;
            display: block;
        }

        .main-navbar ul {
            order: 1;
        }

        /* RESPONSIVE DESIGN */

        @media screen and (max-width: 768px) {

            .top-navbar ul {
                flex-wrap: wrap;
                gap: 12px;
            }

            .main-navbar {
                flex-direction: column-reverse;
                gap: 15px;
            }

            .main-navbar ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 5px;
            }

            .main-navbar a {
                font-size: 12px;
                padding: 8px;
            }

            .logo {
                margin-left: 0;
            }
        }
        #wrapper {
  aspect-ratio: 1.618;
  width: 90vmin;
  position: relative;
}

#wrapper > .shape {
  height: 30%;
  width: 30%;
  background-color: rgba(255 255 255 / 5%);
  position: absolute;
  transition: left, top, height, width, border-radius;
  transition-duration: 750ms;
  transition-timing-function: ease-in-out;
}

#wrapper > .shape:nth-child(1) {
  background-color: #c89925;
  z-index: 2;
}

#wrapper > .shape:nth-child(2) {
  background-color: #c49a45;
  z-index: 2;
}

  z-index: 1;

  z-index: 2;

    <script>
        const wrapper = document.getElementById("wrapper");

const rand = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);

const uniqueRand = (min, max, prev) => {
  let next = prev;
  
  while(prev === next) next = rand(min, max);
  
  return next;
}

const combinations = [
  { configuration: 1, roundness: 1 },
  { configuration: 1, roundness: 2 },
  { configuration: 1, roundness: 4 },
  { configuration: 2, roundness: 2 },
  { configuration: 2, roundness: 3 },
  { configuration: 3, roundness: 3 }
];

let prev = 0;

setInterval(() => {
  const index = uniqueRand(0, combinations.length - 1, prev),
        combination = combinations[index];
  
  wrapper.dataset.configuration = combination.configuration;
  wrapper.dataset.roundness = combination.roundness;
  
  prev = index;
}, 3000);
    </script>
